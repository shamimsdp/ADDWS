packages:
  - apps/*
  - packages/*

engineStrict: true

# pnpm 10 blocks dependency lifecycle scripts unless allowed here (true = run, false = skip silently).
allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  prisma: true
  unrs-resolver: false

# Shared tool versions; packages reference them as "catalog:".
catalog:
  '@eslint/js': 10.0.1
  '@types/node': 24.19.2
  eslint: 10.12.0
  eslint-config-prettier: 10.1.8
  globals: 17.13.0
  prettier: 3.9.10
  turbo: 2.11.7
  typescript: 6.0.3
  typescript-eslint: 8.71.1
  # Web app (FEAT-000.5 / 000.6)
  '@playwright/test': 1.64.0
  '@tailwindcss/postcss': 4.3.3
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  eslint-config-next: 16.4.0
  next: 16.4.0
  react: 19.3.0
  react-dom: 19.3.0
  react-qr-code: 2.2.0
  tailwindcss: 4.3.3
  # API (FEAT-000.2)
  '@nestjs/common': 12.1.2
  '@nestjs/config': 12.0.1
  '@nestjs/core': 12.1.2
  '@nestjs/platform-express': 12.1.2
  '@nestjs/testing': 12.1.2
  '@types/express': 5.0.6
  '@types/supertest': 7.2.1
  class-transformer: 0.5.1
  class-validator: 0.15.1
  nestjs-pino: 5.3.1
  pino: 10.4.0
  pino-http: 11.0.0
  pino-pretty: 13.2.0
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  better-auth: 1.7.7
  nodemailer: 10.1.0
  '@types/nodemailer': 8.0.2
  supertest: 7.3.1
  # Database (FEAT-000.3)
  '@prisma/adapter-pg': 7.10.0
  '@prisma/client': 7.10.0
  prisma: 7.10.0
  # Tests (FEAT-000.4)
  '@swc/core': 1.16.18
  '@vitest/coverage-v8': 5.0.3
  unplugin-swc: 2.0.0
  vite: 8.3.4
  vitest: 5.0.3
